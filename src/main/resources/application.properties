spring.application.name=smart-clinic
server.address=127.0.0.1
server.port=${PORT:8086}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3316/smart_clinic?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:clinic}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
clinic.jwt.secret=${JWT_SECRET}
clinic.demo.enabled=${DEMO_ENABLED:false}
server.error.include-message=never
clinic.admin.email=${ADMIN_EMAIL:admin@example.test}
clinic.admin.password=${ADMIN_PASSWORD}
